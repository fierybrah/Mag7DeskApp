name: Refresh ML predictions

on:
  schedule:
    # Weekdays, a few hours after the 4pm ET close (covers both EDT/EST).
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

# Needed so the job can push data/ml_predictions.json back to this repo.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r ml/requirements.txt

      - name: Fetch, score, and publish predictions
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python -m ml.refresh_predictions --publish
